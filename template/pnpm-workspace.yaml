packages:
  - apps/*
  - packages/*

allowBuilds:
  '@scarf/scarf': false
  # testcontainers経由の依存。ネイティブビルドなしでもJS実装で動くため不要
  cpu-features: false
  esbuild: true
  lefthook: true
  protobufjs: false
  ssh2: false
  unrs-resolver: false
  # @nuxt/ui経由の依存。インストール済みVueのバージョンに合わせてエントリを切り替えるpostinstallのため必要
  vue-demi: true

savePrefix: '~'