# 前回の結果を使わずに全ミュータントを実行する。差分だけの実行では、モジュールの読み込み時に
# 評価されるコードのミュータントが、テストを変えても実行し直されない
name: mutation

on:
  schedule:
    # 毎週月曜 03:00(JST)
    - cron: '0 18 * * 0'
  workflow_dispatch:

concurrency:
  group: mutation
  cancel-in-progress: false

permissions:
  contents: read
  # Takumi Guard に Bot として認証するため、GitHub の OIDC トークンを発行する
  id-token: write

jobs:
  api:
    # 1 分あたりの料金が x64 の同じ 2 コアより安いため、arm64 にする
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
          # レジストリはローカルと CI で同じ設定を使うよう .npmrc で指定しているので、この action には認証だけを任せる
          set-registry: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true
          save-cache: false
      - run: pnpm test:mutation --filter @myapp/api -- --force
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-mutation-report
          path: apps/api/reports/mutation/
          if-no-files-found: ignore
