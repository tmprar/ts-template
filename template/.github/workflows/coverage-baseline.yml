# PR の差分のカバレッジで main と比べるために、main のカバレッジを artifact に保存する。
# ci.yml は main への push では実行しないので、保存はこのワークフローに分ける
name: coverage-baseline

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/coverage-baseline.yml'
  workflow_dispatch:

concurrency:
  group: coverage-baseline
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    strategy:
      matrix:
        package: [api, web]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true
          save-cache: false
      - run: pnpm test:cov --filter @myapp/${{ matrix.package }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-baseline-${{ matrix.package }}
          path: apps/${{ matrix.package }}/coverage/coverage-summary.json
          if-no-files-found: error
