# PR で検査する。template/.github/workflows/ci.yml は作ったプロジェクト用で、このリポジトリでは動かない。
# テンプレートは、CLI で実際にプロジェクトを作り、そのプロジェクトで検査する
name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # CLI の静的検査と単体テスト
  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Node は package.json の engines.node の下限に合わせる
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:cov
      - run: pnpm compile

  # CLI でプロジェクトを作り、そのプロジェクトで検査する
  generated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            template/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      # 名前はハイフン入りにして、各表記(kebab / Pascal / UPPER_SNAKE)への置き換えを通す
      - run: node dist/index.js "$RUNNER_TEMP/sample-app" --name sample-app --yes
      - working-directory: ${{ runner.temp }}/sample-app
        run: |
          pnpm lint
          pnpm typecheck
          pnpm depcruise
          pnpm test
          pnpm test:integration
